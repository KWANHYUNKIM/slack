# CI: PR(main 대상)과 main push마다 백엔드·프런트엔드 검사를 돌린다.
# 규칙 출처: docs/conventions/git.md (GitHub Flow), docs/security/nodejs-security.md 1절
# 참고: Playwright E2E는 무거워서 이번 범위에서 뺐다(아래 TODO 참고).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 ref에서 새 실행이 들어오면 이전 실행을 취소한다(푸시 연타 시 러너 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본 권한은 읽기 전용. 필요한 job만 따로 올린다(지금은 아무것도 필요 없음).
permissions:
  contents: read

jobs:
  backend:
    name: backend (test, typecheck, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/backend
    env:
      NODE_ENV: test
      # 서비스 컨테이너는 러너의 localhost:5432에 포트를 연다.
      # 이 DB는 CI 러너 안에서만 살고 사라지므로 비밀번호 'password'는 외부에 노출되지 않는다.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/slackclone?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: slackclone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slackclone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      # setup-node가 깐 npm 버전을 확인한다(npm 11 이상 필요). Node 24는 npm 11을 기본으로 싣지만,
      # 러너나 설정이 바뀌어도 조용히 낡은 npm으로 돌지 않도록 여기서 실패하게 둔다.
      # npm 11은 lockfile에 있는 패키지라도 package.json의 allowScripts에 없으면 install script를 막는다.
      # app/backend/package.json에 prisma, bcrypt, sharp 등 8개를 허용해 두었다(로컬에서 `npm install-scripts approve`로 확인).
      # app/frontend는 아직 허용 목록이 없으니, 첫 CI 실행 로그에서 차단 경고가 나오면 같은 방식으로 추가한다.
      - name: Verify npm version (>= 11)
        run: |
          npm -v
          major=$(npm -v | cut -d. -f1)
          if [ "$major" -lt 11 ]; then
            echo "npm 11 이상이 필요하다 (현재: $(npm -v))" >&2
            exit 1
          fi

      # JWT_SECRET, SEED_PASSWORD, DEMO_PASSWORD는 실행마다 새로 만든다.
      # 저장소에 시크릿 값을 하드코딩하지 않는다. ::add-mask::로 로그에서 가린다.
      - name: Generate ephemeral test secrets
        run: |
          for name in JWT_SECRET SEED_PASSWORD DEMO_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      # 테스트는 src/tests/*.test.ts 전체를 돈다(CRUD 흐름 포함: messages, channels, dms, reactions,
      # edit-delete, files, webhooks 등). setup.ts가 시작 전에 DB를 비우므로 이 DB 전용이다.
      - name: Test
        run: npm test -- --forceExit

      # high 이상이 하나라도 있으면 실패한다(docs/security/nodejs-security.md 1절). PR #4, #6으로 0건이 됐다.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: frontend (lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 규칙 17: 소스에 외부 https 리터럴(CDN, 이미지 등)이 없는지 검사한다.
      - name: Check external URLs
        working-directory: .
        run: scripts/check-external-urls.sh

      - name: Build
        run: npm run build

      # high 이상이 하나라도 있으면 실패한다(docs/security/nodejs-security.md 1절). PR #4, #6으로 0건이 됐다.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # TODO: Playwright E2E(app/frontend/tests, playwright.config.ts)는 러너 시간과 메모리를 많이 써서
      # 이번 CI에서 뺐다. 다음 단계에서 별도 job으로 추가하고 services(백엔드 서버 + DB)를 함께 띄운다.
