# 릴리스: v* 태그가 푸시되면 세 OS에서 데스크톱 설치 파일을 만들어 GitHub Releases에 올린다.
# 구조: docs/architecture/enterprise-and-distribution.md 2절, 버전 규칙: docs/conventions/git.md 5절, 운영: docs/ops/release.md
#
# 호출 경로 두 가지
#  1) 사람이 태그를 직접 푸시한다 (on.push.tags)
#  2) release-please.yml이 draft 릴리스와 태그를 만든 뒤 이 워크플로를 호출한다 (workflow_call).
#     GITHUB_TOKEN으로 만든 태그는 push 이벤트를 일으키지 않으므로, 이렇게 직접 호출해야 빌드가 돈다.
# 어느 경로든 릴리스는 draft로 만들고, 모든 설치 파일을 올린 뒤 마지막에 공개한다(scripts/release-publish.sh).
#
# 서명: 인증서 시크릿이 없으면 서명 없이 빌드한다(처음 배포 방식). OS별로 따로 판정한다(scripts/release-sign.mjs).
# 공급망: 모든 action은 커밋 SHA로 고정하고 주석에 버전을 적는다. 릴리스 업로드는 서드파티 action 없이 gh CLI로 한다.
#
# 자동 업데이트(electron-updater, latest.yml 피드)는 이 파트에 넣지 않았다:
#  업데이트 피드는 앱이 실행 중에 외부 https(github.com)에서 받아 오는 것이라 규칙 17의 예외 목록(웹 푸시)에 없다.
#  그래서 electron-builder.yml의 publish는 null로 두고 --publish never로 빌드한다(latest.yml 생성 안 함).

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 릴리스 태그 (예 v0.2.0)
        required: true
        type: string

# 기본 권한은 읽기 전용. 릴리스에 올리는 publish job만 contents: write를 따로 받는다.
permissions:
  contents: read

# 같은 태그의 중복 실행(태그 푸시와 workflow_call이 겹치는 경우)을 한 줄로 세운다. 진행 중인 업로드는 취소하지 않는다.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# shell: bash를 명시하면 -eo pipefail로 돌아서, 파이프 앞 명령이 실패해도 단계가 실패한다.
defaults:
  run:
    shell: bash

jobs:
  # 태그 형식과 app/desktop/package.json 버전 일치를 검사한다. 통과 못 하면 빌드하지 않는다.
  prepare:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # 입력값은 env로만 넘긴다(스크립트에 ${{ }}를 직접 끼워 넣으면 명령 주입 위험).
      # pipefail이 켜져 있어 검증 스크립트가 실패하면 tee가 성공해도 이 단계가 실패한다.
      - name: Validate tag against app/desktop/package.json
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-tag.mjs "$RELEASE_TAG" app/desktop/package.json | tee -a "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false # 한 OS가 실패해도 나머지 설치 파일은 끝까지 만든다
      matrix:
        include:
          # artifacts는 electron-builder.yml의 artifactName과 같은 이름만 명시한다(__uninstaller 같은 내부 산출물 제외)
          - name: windows
            os: windows-latest
            flag: --win
            artifacts: |
              app/desktop/release/TeamMessenger-Setup-*.exe
              app/desktop/release/TeamMessenger-*-portable.exe
          - name: macos
            os: macos-latest
            flag: --mac
            artifacts: |
              app/desktop/release/TeamMessenger-*.dmg
          - name: linux
            os: ubuntu-latest
            flag: --linux
            artifacts: |
              app/desktop/release/TeamMessenger-*.AppImage
    defaults:
      run:
        shell: bash # job의 defaults가 워크플로 defaults를 덮어쓸 수 있어 여기에도 명시한다
        working-directory: app/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc 빌드 + 단위 테스트 + electron-builder 설정 검증. 이 단계가 dist/를 만들므로 아래에서 다시 빌드하지 않는다.
      - name: Test (also builds dist/)
        run: npm test

      # OS별 서명 판정. 시크릿은 해당 OS 키만 env에 넣는다(Windows는 WIN_CSC_*, mac은 CSC_*).
      # 값은 출력하지 않고 true/false만 기록한다.
      - name: Detect signing credentials
        id: sign
        env:
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          node ../../scripts/release-sign.mjs "${{ matrix.name }}" | tee -a "$GITHUB_OUTPUT"

      # 서명·비서명을 한 단계로 처리한다. 서명 키가 없으면 CSC_IDENTITY_AUTO_DISCOVERY=false로 서명을 건너뛰고
      # (러너 키체인의 인증서를 멋대로 쓰지 않게 한다), 서명하면 electron-builder가 위 env의 키를 읽는다.
      # mac notarization은 판정이 true일 때만 -c.mac.notarize=true를 붙인다.
      # electron-builder를 직접 호출한다(npm run dist:*는 build를 한 번 더 돌린다).
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.sign.outputs.sign == 'true' && 'true' || 'false' }}
          NOTARIZE_ARG: ${{ steps.sign.outputs.notarize == 'true' && '-c.mac.notarize=true' || '' }}
          WIN_CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-builder ${{ matrix.flag }} --publish never $NOTARIZE_ARG

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  # TODO(후속, docker 파트 dev-5와 함께): 웹 Docker 이미지 빌드·게시 job을 여기에 추가한다.
  #  docker:
  #    needs: prepare
  #    permissions: { contents: read, packages: write }
  #    app/Dockerfile을 태그(needs.prepare.outputs.version)로 빌드해 ghcr.io에 올린다. 외부 레지스트리 의존과 권한은 그때 정한다.

  # 세 OS 산출물이 모두 있을 때만 릴리스에 올린다(하나라도 실패하면 올리지 않는다).
  # draft로 만들고, 업로드가 모두 끝난 뒤 마지막에 공개한다.
  publish:
    name: upload to GitHub Releases
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 릴리스 생성, 파일 업로드, 공개. 토큰은 GITHUB_TOKEN뿐이다
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      # 스크립트만 필요하다. 토큰은 저장하지 않는다.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist-installers
          merge-multiple: true

      # 명시적 패턴(TeamMessenger-*)만 대상으로 한다.
      - name: Checksums
        working-directory: dist-installers
        run: sha256sum TeamMessenger-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload and publish release
        run: bash scripts/release-publish.sh dist-installers/TeamMessenger-* dist-installers/SHA256SUMS.txt
