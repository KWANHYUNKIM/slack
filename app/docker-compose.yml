# app + postgres. 사용법: cp .env.example .env (값 채우기) -> docker compose up -d --build
# 운영은 TLS 리버스 프록시(nginx, Caddy 등) 뒤에 두고 PUBLIC_URL=https://... 로 설정하는 것을 권장한다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: slackclone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slackclone"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      # DATABASE_URL은 entrypoint가 PG* 변수로 조합한다(비밀번호의 특수문자는 자동 인코딩).
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: slackclone
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      # 프록시 뒤 홉 수. 기본 0(신뢰 안 함). 리버스 프록시 뒤에서는 1.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 서비스 공개 주소. http:// 이면 HSTS, upgrade-insecure-requests, secure 쿠키를 끈다(LAN 시험용).
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      # 허들 STUN/TURN. 기본은 내장 STUN 켜짐(끄려면 STUN_ENABLED=false).
      STUN_ENABLED: ${STUN_ENABLED:-true}
      STUN_PORT: ${STUN_PORT:-3478}
      STUN_PUBLIC_HOST: ${STUN_PUBLIC_HOST:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${STUN_PORT:-3478}:${STUN_PORT:-3478}/udp"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
